<div class="alertas-container">
    <mat-card class="alertas-card">
        <mat-card-header class="alertas-header">
            <mat-card-title>Alertas de Sensores</mat-card-title>
            <mat-card-subtitle>Configura y administra las alertas de tus sensores</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content class="alertas-content">
            <div class="alertas-cards-container">
                <mat-card class="config-card">
                    <mat-card-header class="config-header">
                        <mat-card-title>Configuración de Alertas</mat-card-title>
                        <mat-card-subtitle>Configura las alertas para tus sensores</mat-card-subtitle>
                    </mat-card-header>
                    <mat-card-content>
                        <mat-card-actions>
                            <button mat-button (click)="goToComponent('sensor/config-alert')">
                                Configurar
                                <mat-icon>settings</mat-icon>
                            </button>
                        </mat-card-actions>
                    </mat-card-content>
                </mat-card>
                <mat-card class="edit-card">
                    <mat-card-header class="edit-header">
                        <mat-card-title>Editar Alertas</mat-card-title>
                        <mat-card-subtitle>Edita las alertas para tus sensores</mat-card-subtitle>
                    </mat-card-header>
                    <mat-card-content>
                        <mat-card-actions>
                            <button mat-button (click)="goToComponent('sensor/gestion-alert')">
                                Editar
                                <mat-icon>edit</mat-icon>
                            </button>
                        </mat-card-actions>
                    </mat-card-content>
                </mat-card>
                <mat-card class="historial-card">
                    <mat-card-header class="historial-header">
                        <mat-card-title>HISTORIAL DE ALERTAS</mat-card-title>
                        <mat-card-subtitle>ver historial de tus alertas</mat-card-subtitle>
                    </mat-card-header>
                    <mat-card-content class="historial-content">
                        <mat-card-actions>
                            <button mat-button (click)="goToComponent('sensor/historial-alert')">
                                Historial
                                <mat-icon>history</mat-icon>
                            </button>
                        </mat-card-actions>
                    </mat-card-content>
                </mat-card>
            </div>
        </mat-card-content>
    </mat-card>
</div>
