<div class="flex flex-col items-center justify-center min-h-screen bg-gray-100 p-4">
  <mat-card class="w-full max-w-2xl p-6 shadow-lg rounded-xl bg-white relative">

    <mat-card-header class="mb-6">
      <mat-card-title class="text-3xl font-bold text-center w-full text-green-700">
        Registro de Tipos de Sensor
      </mat-card-title>
      <mat-card-subtitle class="text-center w-full text-gray-600 mt-2">
        Selecciona un cultivo y luego el tipo de sensor a registrar.
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <!-- Indicador de carga -->
      <div *ngIf="loading" class="flex flex-col justify-center items-center h-32">
        <mat-spinner color="primary" class="mb-4"></mat-spinner>
        <p class="text-gray-600">Cargando cultivos...</p>
      </div>

      <!-- Mensaje de error -->
      <div *ngIf="errorMessage" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
        <strong class="font-bold">¡Error!</strong>
        <span class="block sm:inline"> {{ errorMessage }}</span>
      </div>

      <!-- Selector de Cultivo y Botones de Sensor (Solo si no hay carga ni error) -->
      <ng-container *ngIf="!loading && !errorMessage">
        <mat-form-field appearance="outline" class="w-full mb-6">
          <mat-label>Seleccionar Cultivo</mat-label>
          <mat-select [(ngModel)]="selectedCultivo" name="cultivo" required>
            <mat-option *ngFor="let cultivo of cultivoOptions" [value]="cultivo">
              {{ cultivo }}
            </mat-option>
          </mat-select>
          <mat-hint *ngIf="!selectedCultivo" class="text-red-500">Por favor, selecciona un cultivo para continuar.</mat-hint>
          <mat-error *ngIf="!selectedCultivo">Cultivo es requerido</mat-error>
        </mat-form-field>

        <!-- Botones de tipo de sensor -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <button mat-raised-button color="primary" class="p-6 h-auto flex flex-col items-center justify-center text-center rounded-lg shadow-md hover:shadow-lg transition-shadow duration-300 transform hover:scale-105"
            (click)="goToComponent('temperatura')" [disabled]="!selectedCultivo">
            <mat-icon class="text-5xl mb-2">thermostat</mat-icon>
            <span class="text-lg font-semibold">Temperatura</span>
            <span class="text-sm text-gray-200 mt-1">Mide la temperatura ambiente.</span>
          </button>

          <button mat-raised-button color="primary" class="p-6 h-auto flex flex-col items-center justify-center text-center rounded-lg shadow-md hover:shadow-lg transition-shadow duration-300 transform hover:scale-105"
            (click)="goToComponent('humedad')" [disabled]="!selectedCultivo">
            <mat-icon class="text-5xl mb-2">water_drop</mat-icon>
            <span class="text-lg font-semibold">Humedad</span>
            <span class="text-sm text-gray-200 mt-1">Mide la humedad del aire o suelo.</span>
          </button>

          <button mat-raised-button color="primary" class="p-6 h-auto flex flex-col items-center justify-center text-center rounded-lg shadow-md hover:shadow-lg transition-shadow duration-300 transform hover:scale-105"
            (click)="goToComponent('ph')" [disabled]="!selectedCultivo">
            <mat-icon class="text-5xl mb-2">science</mat-icon>
            <span class="text-lg font-semibold">pH</span>
            <span class="text-sm text-gray-200 mt-1">Mide la acidez/alcalinidad del suelo.</span>
          </button>
        </div>
      </ng-container>
    </mat-card-content>
  </mat-card>
</div>
